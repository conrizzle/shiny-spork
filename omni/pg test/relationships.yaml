- join_from_view: ecomm_with_dbt_public__events
  join_to_view: ecomm_with_dbt_public__users
  join_type: always_left
  on_sql: ${ecomm_with_dbt_public__events.user_id} = ${ecomm_with_dbt_public__users.id}
  relationship_type: assumed_many_to_one

- join_from_view: ecomm_with_dbt_public__inventory_items
  join_to_view: ecomm_with_dbt_public__products
  join_type: always_left
  on_sql: ${ecomm_with_dbt_public__inventory_items.product_id} =
    ${ecomm_with_dbt_public__products.id}
  relationship_type: assumed_many_to_one

- join_from_view: ecomm_with_dbt_public__order_items
  join_to_view: ecomm_with_dbt_public__users
  join_type: always_left
  on_sql: ${ecomm_with_dbt_public__order_items.user_id} =
    ${ecomm_with_dbt_public__users.id}
  relationship_type: assumed_many_to_one

- join_from_view: ecomm_with_dbt_public__order_items
  join_to_view: ecomm_with_dbt_public__inventory_items
  join_type: always_left
  on_sql: ${ecomm_with_dbt_public__order_items.inventory_item_id} =
    ${ecomm_with_dbt_public__inventory_items.id}
  relationship_type: assumed_many_to_one

- join_from_view: ecomm_with_dbt_public__products
  join_to_view: ecomm_with_dbt_public__distribution_centers
  join_type: always_left
  on_sql: ${ecomm_with_dbt_public__products.distribution_center_id} =
    ${ecomm_with_dbt_public__distribution_centers.id}
  relationship_type: assumed_many_to_one
